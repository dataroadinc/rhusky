name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-crate-ci.yml@main
    with:
      crate-name: rhusky
      test-threads: "1"
    secrets:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
