[package]
name = "rhusky"
description = "Git hooks manager for Rust projects - like Husky, but for Rust"
version = "0.0.6"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["git", "hooks", "husky", "pre-commit", "commit-msg"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
repository = "https://github.com/legra-ai/rhusky"
documentation = "https://docs.rs/rhusky"
homepage = "https://github.com/legra-ai/rhusky"
rust-version = "1.85.0"
publish = true

exclude = [
    ".cargo/",
    ".clippy.toml",
    ".cursor/",
    ".github/",
    ".gitignore",
    ".rust-toolchain.toml",
    ".vscode/",
    "cog.toml",
    "rustfmt.toml",
]

[lib]
name = "rhusky"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
serial_test = "3.5"
tempfile = "3.27"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
